[tools]
dart = "latest"

[tasks.test]
description = "Run unit, CLI, and conformance infrastructure tests (excludes tagged reference tests)"
run = "dart test --exclude-tags conformance,reference"

[tasks.analyze]
run = "dart analyze --fatal-infos"

[tasks.format]
description = "Format Dart sources; pass --check for CI"
run = "dart run test/support/format.dart"

[tasks.conformance]
description = "Execute the full pinned jq corpus with zaru; fails while any case fails"
run = "dart run tool/conformance.dart"

[tasks.conformance-gate]
description = "M1 acceptance gate: frozen M1 cases and the passed-ID floor, no jq needed"
run = "dart run tool/conformance.dart --gate"

[tasks.reference-setup]
description = "Build and verify the pinned native jq reference tools explicitly"
run = "dart run tool/reference_setup.dart"

[tasks.reference-census]
description = "Explicitly regenerate the native jq reference census"
run = "dart run tool/reference_census.dart --output test/conformance/reference/census.json"

[tasks.reference-freeze]
description = "Record SHA-256 integrity for the reviewed census and classification, then verify them"
run = "dart run tool/reference_verify.dart --record"

[tasks.reference-verify]
description = "Verify the frozen reference census/classification integrity without running jq"
run = "dart run tool/reference_verify.dart"

[tasks.reference-classification]
description = "Regenerate the source-only pinned jq grammar and builtin classification"
run = "dart run tool/reference_classification.dart test/conformance/jq.test test/conformance/man.test test/conformance/reference/classification.json"
[tasks.reference-test]
description = "Run VM-only native jq reference-census integration tests"
run = "dart test test/conformance/reference_census_test.dart --tags reference --reporter expanded"
[tasks.classification-test]
description = "Run source-only jq grammar and builtin classification regression tests"
run = "dart test test/conformance/reference_classification_test.dart --tags reference --reporter expanded"

[tasks.bench]
description = "Placeholder: no benchmarks until a measured performance problem (see openspec/strategy.md)"
run = "echo No benchmarks are implemented; see openspec/strategy.md. && exit 2"

[tasks.example]
description = "Run the core-engine example"
run = "dart run example/zaru_example.dart"

[tasks.cli]
run = "dart run bin/zaru.dart"

[tasks.pub]
run = "dart pub get --enforce-lockfile"

[tasks.compile]
run = "dart compile exe bin/zaru.dart"

[tasks.web-test]
description = "Run browser-safe unit tests in Chrome using dart2js"
run = "dart test test/unit -p chrome --compiler dart2js"

[tasks.web-test-wasm]
description = "Run browser-safe unit tests in Chrome using dart2wasm"
run = "dart test test/unit -p chrome --compiler dart2wasm"
