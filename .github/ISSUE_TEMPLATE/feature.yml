name: Feature request
description: Suggest something zaru should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Only the first box is required.

        Check [docs/compat.md](https://github.com/sh1ny/zaru/blob/main/docs/compat.md) first: it lists the jq features that aren't implemented yet.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional. How you'd like it to work, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Workarounds you use now, or other approaches you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Your best guess is fine.
      options:
        - Filter evaluation
        - Builtins
        - Paths and assignment
        - Parser and compile errors
        - Numbers
        - CLI
        - Web and wasm
        - Other
